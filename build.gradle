plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'application'
    id 'java'
    id 'maven-publish'
}

apply plugin: 'java'
apply plugin: 'com.github.johnrengelman.shadow'

group = project.group_id
version = project.version_name

publishing {
    publications {
        gpr(MavenPublication) {
            groupId = project.group_id
            artifactId = project.artifact_id
            version = project.version_name

            from components.java
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}

subprojects {
    repositories {
        mavenCentral()
        maven {
            url 'https://jitpack.io'
        }
    }
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-api:2.25.4'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'io.netty:netty-all:4.2.14.Final'
    implementation 'com.github.oshi:oshi-core:6.6.3'
    implementation "com.github.cao-awa:Cason:$project.cason_version"
    implementation "com.github.cao-awa:CaperTML:$project.capertml_version"

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

application {
    mainClass = project.mainClass
}

shadowJar {
    archiveBaseName.set('Kora')
    archiveVersion.set(project.version_name)
    archiveClassifier.set('')
}

kotlin {
    jvmToolchain(21)
}

test {
    useJUnitPlatform()
}

tasks.named("distTar") {
    dependsOn shadowJar
}

tasks.named("startScripts"){
    dependsOn shadowJar
}

tasks.named("startShadowScripts") {
    dependsOn jar
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21